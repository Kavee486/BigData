# Prometheus scrape + rule configuration for the smart-grid pipeline.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: serving-api          # pipeline-wide gauges, refreshed from Postgres per scrape
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: meter-producer       # streaming source delivery counters
    static_configs:
      - targets: ["meter-producer:8001"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
